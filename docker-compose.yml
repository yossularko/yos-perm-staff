name: yos-perm-staff

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: yos-perm-staff:latest
    container_name: yos-perm-staff
    restart: unless-stopped
    # Ganti ke "127.0.0.1:3446:3446" bila nanti diletakkan di belakang
    # reverse proxy (nginx/traefik) dan tidak perlu diakses langsung dari luar.
    ports:
      - "3446:3446"
    environment:
      NODE_ENV: production
      PORT: "3446"
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: "1"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3446/",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
